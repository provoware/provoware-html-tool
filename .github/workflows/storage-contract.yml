name: Storage contract

on:
  pull_request:
    paths:
      - "app/services/project_service.py"
      - "app/storage/json_document_store.py"
      - "app/storage/state_store.py"
      - "app/utils/atomic_write.py"
      - "tests/test_atomic_write.py"
      - "tests/test_project_service.py"
      - "pyproject.toml"
      - ".github/workflows/storage-contract.yml"
  push:
    branches: [main]
    paths:
      - "app/services/project_service.py"
      - "app/storage/json_document_store.py"
      - "app/storage/state_store.py"
      - "app/utils/atomic_write.py"
      - "tests/test_atomic_write.py"
      - "tests/test_project_service.py"
      - "pyproject.toml"
      - ".github/workflows/storage-contract.yml"

permissions:
  contents: read

jobs:
  storage-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Test atomic storage and workspace persistence
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_atomic_write.py tests/test_project_service.py
