<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo-Modul - Einzelstart</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; line-height: 1.4; }
      input { min-width: 280px; padding: 0.45rem; }
      button { padding: 0.5rem 0.8rem; margin-left: 0.4rem; }
      pre { background: #f3f5f7; padding: 0.8rem; border-radius: 8px; overflow: auto; }
    </style>
    <script type="application/json" id="start-file-standard">
      {"modulePath":"./modules/todo_kalender_erinnerung/logic.js","expectedExports":["createTodoEntry","summarizeTodoStatus"]}
    </script>
  </head>
  <body>
    <main aria-labelledby="page-title">
      <h1 id="page-title">Todo-Kalender-Erinnerung (Einzelstart)</h1>
      <p>Hier läuft nur das Todo-Modul ohne Dashboard.</p>
      <label for="title">Aufgabe:</label>
      <input id="title" type="text" placeholder="z. B. Termin prüfen" maxlength="120" />
      <button id="add" type="button">Aufgabe erzeugen</button>
      <button id="export" type="button">Export</button>
      <button id="import" type="button">Import</button>
      <input id="import-file" type="file" accept="application/json" hidden />
      <pre id="out" role="status" aria-live="polite">Noch keine Aufgabe.</pre>
    </main>

    <script type="module">
      import { createTodoEntry, summarizeTodoStatus } from './modules/todo_kalender_erinnerung/logic.js';

      const out = document.getElementById('out');
      const tasks = [];
      const triggerDownload = (filename, text) => {
        const blob = new Blob([text], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.click();
        URL.revokeObjectURL(url);
      };

      document.getElementById('add').addEventListener('click', () => {
        const title = document.getElementById('title').value.trim();
        if (!title) {
          out.textContent = 'Titel fehlt.';
          return;
        }

        const next = createTodoEntry({ title });
        tasks.push(next);
        out.textContent = JSON.stringify({ summary: summarizeTodoStatus(tasks), tasks }, null, 2);
      });

      document.getElementById('export').addEventListener('click', () => {
        triggerDownload('todo_kalender_erinnerung_export.json', JSON.stringify(tasks, null, 2));
        out.textContent = 'Export erstellt und Download gestartet.';
      });

      const importFile = document.getElementById('import-file');
      document.getElementById('import').addEventListener('click', () => importFile.click());
      importFile.addEventListener('change', async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          tasks.splice(0, tasks.length, ...(Array.isArray(parsed) ? parsed : []));
          out.textContent = JSON.stringify({ summary: summarizeTodoStatus(tasks), tasks }, null, 2);
        } catch {
          out.textContent = 'Import fehlgeschlagen. Bitte gültige JSON-Datei wählen.';
        } finally {
          importFile.value = '';
        }
      });
    </script>
  </body>
</html>
