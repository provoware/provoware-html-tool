<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provoware Dashboard</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #0f172a;
        --surface: #e2e8f0;
        --accent: #005fcc;
        --space-xs: 0.5rem;
        --space-sm: 0.75rem;
        --space-md: 1rem;
        --space-lg: 1.5rem;
        --field-height: 44px;
        --radius: 10px;
      }
      [data-theme="dark"] {
        --bg: #0f172a;
        --fg: #f8fafc;
        --surface: #1e293b;
        --accent: #60a5fa;
      }
      [data-theme="contrast"] {
        --bg: #000000;
        --fg: #ffff00;
        --surface: #111111;
        --accent: #00ffff;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: Arial, sans-serif;
      }
      .wrap {
        max-width: 860px;
        margin: var(--space-lg) auto;
        padding: var(--space-md);
      }
      .card {
        background: var(--surface);
        border: 2px solid var(--accent);
        border-radius: var(--radius);
        padding: var(--space-md);
        margin-bottom: var(--space-md);
      }
      button,
      select,
      input {
        min-height: var(--field-height);
        padding: 0 var(--space-sm);
        border: 2px solid var(--accent);
        border-radius: 8px;
        background: var(--bg);
        color: var(--fg);
      }
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .zones {
        display: grid;
        gap: var(--space-sm);
      }
      .zone-header {
        display: flex;
        gap: var(--space-xs);
        justify-content: space-between;
        align-items: center;
      }
      .hint {
        font-size: 0.95rem;
      }
      .actions {
        display: flex;
        gap: var(--space-xs);
      }
      .debug {
        white-space: pre-wrap;
        margin-top: var(--space-sm);
      }
    </style>
  </head>
  <body data-theme="light">
    <main class="wrap">
      <h1>Modernes Dashboard</h1>
      <p class="hint">
        Dieses Dashboard zeigt wichtige Bereiche klar und in einfacher Sprache.
      </p>

      <section class="card" aria-labelledby="start-title">
        <h2 id="start-title">Projektstart</h2>
        <label for="theme-select">Farbthema</label>
        <select id="theme-select" aria-label="Farbthema wählen">
          <option value="light">Hell</option>
          <option value="dark">Dunkel</option>
          <option value="contrast">Kontrast+</option>
        </select>
        <div class="actions">
          <button id="choose-folder">Projektordner wählen</button>
          <button id="reconnect-folder">Auto-Reconnect prüfen</button>
        </div>
        <p id="status" aria-live="polite">Bereit.</p>
        <button id="toggle-debug">Debug-Modus anzeigen</button>
        <pre id="debug-output" class="debug" hidden></pre>
      </section>

      <section class="card" aria-labelledby="zones-title">
        <h2 id="zones-title">Dashboard-Zonen</h2>
        <p class="hint">Drag&Drop oder Pfeil-Buttons nutzen.</p>
        <div id="zones" class="zones"></div>
      </section>
    </main>
    <script src="dashboard.js"></script>
  </body>
</html>
