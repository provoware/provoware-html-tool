<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provoware Hilfe-Panel</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #111111;
        --accent: #005fcc;
        --panel: #f1f5f9;
      }
      [data-theme="dark"] {
        --bg: #121212;
        --fg: #f8fafc;
        --accent: #60a5fa;
        --panel: #1f2937;
      }
      [data-theme="contrast"] {
        --bg: #000000;
        --fg: #ffff00;
        --accent: #00ffff;
        --panel: #111111;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .wrap {
        max-width: 760px;
        margin: 1rem auto;
        padding: 1rem;
      }
      .panel {
        background: var(--panel);
        border: 2px solid var(--accent);
        border-radius: 12px;
        padding: 1rem;
      }
      button,
      select {
        min-height: 44px;
        padding: 0.5rem 0.75rem;
        margin: 0.25rem 0;
        border: 2px solid var(--accent);
      }
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      #status {
        margin-top: 0.75rem;
        font-weight: bold;
      }
      pre {
        white-space: pre-wrap;
        background: var(--bg);
        padding: 0.75rem;
        border: 1px solid var(--accent);
      }
    </style>
  </head>
  <body data-theme="light">
    <main class="wrap">
      <h1 id="title">Hilfe und Diagnose</h1>
      <section class="panel" aria-labelledby="title">
        <label for="theme">Farbthema wählen</label>
        <select id="theme" aria-label="Farbthema wählen">
          <option value="light">Hell</option>
          <option value="dark">Dunkel</option>
          <option value="contrast">Kontrast+</option>
        </select>
        <div>
          <button id="run-test">Systemtest ausführen</button>
          <button id="show-log">Logs anzeigen</button>
        </div>
        <p id="status" aria-live="polite">Bereit.</p>
        <pre id="log-box" hidden></pre>
      </section>
    </main>
    <script src="help-panel.js"></script>
  </body>
</html>
