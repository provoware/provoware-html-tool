<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProvoWare Laienstart</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem auto; max-width: 760px; line-height: 1.45; }
      .card { border: 1px solid #d8dee4; border-radius: 10px; padding: 1rem; margin-bottom: 0.8rem; background: #fff; }
      .muted { color: #475569; }
      .row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
      button { padding: 0.55rem 0.8rem; border: 1px solid #94a3b8; border-radius: 8px; cursor: pointer; }
      button.primary { background: #0f766e; color: #fff; border-color: #0f766e; }
      progress { width: 100%; height: 1rem; }
      .ok { color: #166534; }
      .warn { color: #9a3412; }
      code { background: #f1f5f9; padding: 0.1rem 0.3rem; border-radius: 4px; }
      ul { margin: 0.4rem 0 0.3rem 1.2rem; }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <h1 id="title">ProvoWare Laienstart</h1>
      <p class="muted">Diese Seite prüft automatisch den Start, zeigt Status und versucht bei Bedarf eine automatische Korrektur.</p>

      <section class="card" aria-label="Fortschritt">
        <strong>Fortschritt</strong>
        <progress id="progress" value="0" max="100"></progress>
        <p id="status" role="status" aria-live="polite">Status: Prüfen wird vorbereitet.</p>
      </section>

      <section class="card" aria-label="Prüfergebnisse">
        <strong>Aktueller Prüfpfad</strong>
        <ul id="checks"></ul>
      </section>

      <section class="card" aria-label="Fehler und Lösungen">
        <strong>Fehlercode und Lösung</strong>
        <p id="exit-code">Code: <code>START_INIT</code></p>
        <ul id="solutions">
          <li>Start wird vorbereitet.</li>
        </ul>
      </section>

      <section class="card" aria-label="Aktionen">
        <div class="row">
          <button id="auto-fix" class="primary" type="button">Automatisch korrigieren</button>
          <button id="retry" type="button">Prüfung erneut starten</button>
        </div>
      </section>
    </main>

    <script>
      const requiredFiles = [
        './index.html',
        './css/app.css',
        './js/app.js',
        './data/app-config.json',
        './data/module-registry.json'
      ];

      const progressEl = document.getElementById('progress');
      const statusEl = document.getElementById('status');
      const checksEl = document.getElementById('checks');
      const exitCodeEl = document.getElementById('exit-code');
      const solutionsEl = document.getElementById('solutions');
      const autoFixBtn = document.getElementById('auto-fix');
      const retryBtn = document.getElementById('retry');

      let autoFixMode = false;
      let attempt = 0;

      const setCode = (code, solutions) => {
        exitCodeEl.innerHTML = `Code: <code>${code}</code>`;
        solutionsEl.innerHTML = solutions.map((item) => `<li>${item}</li>`).join('');
      };

      const addCheckLine = (text, ok) => {
        const li = document.createElement('li');
        li.className = ok ? 'ok' : 'warn';
        li.textContent = text;
        checksEl.appendChild(li);
      };

      const checkFile = async (file, cacheBust = false) => {
        const url = cacheBust ? `${file}?v=${Date.now()}` : file;
        const response = await fetch(url, { method: 'GET', cache: 'no-store' });
        return response.ok;
      };

      const runChecks = async (cacheBust = false) => {
        checksEl.innerHTML = '';
        progressEl.value = 0;
        statusEl.textContent = 'Status: Starte Prüfung auf vorhandene Dateien.';
        setCode('START_CHECK_RUNNING', ['Bitte warten: Die Startprüfung läuft.']);

        for (let i = 0; i < requiredFiles.length; i += 1) {
          const file = requiredFiles[i];
          const ok = await checkFile(file, cacheBust).catch(() => false);
          addCheckLine(`${ok ? 'OK' : 'Fehlt/Fehler'}: ${file}`, ok);
          progressEl.value = Math.round(((i + 1) / requiredFiles.length) * 100);
          if (!ok) {
            statusEl.textContent = `Status: Problem gefunden in ${file}.`;
            setCode('START_MISSING_RESOURCE', [
              'Option 1: Automatische Korrektur starten (empfohlen).',
              'Option 2: Prüfung erneut starten.',
              'Hinweis: Es wird nicht abgebrochen. Die Startseite bleibt aktiv.'
            ]);
            return false;
          }
        }

        statusEl.textContent = 'Status: Alle Prüfungen ok. GUI startet jetzt.';
        setCode('START_OK', [
          'Alle benötigten Dateien sind erreichbar.',
          'Die Oberfläche wird jetzt geöffnet.'
        ]);
        window.location.href = './index.html?autostart=1';
        return true;
      };

      const runAutoFixLoop = async () => {
        autoFixMode = true;
        attempt += 1;
        statusEl.textContent = `Status: Auto-Korrektur Versuch ${attempt} läuft.`;
        setCode('START_AUTOFIX_RUNNING', [
          'Dateien werden mit Cache-Bypass erneut geprüft.',
          'Bei Fehlern wird automatisch weiter versucht.'
        ]);

        const ok = await runChecks(true);
        if (!ok && autoFixMode) {
          setTimeout(runAutoFixLoop, 3000);
        }
      };

      autoFixBtn.addEventListener('click', () => {
        if (!window.confirm('Soll die automatische Korrektur mit Wiederholversuchen gestartet werden?')) {
          setCode('START_AUTOFIX_ABORTED_BY_CHOICE', ['Keine Sorge: Es wurde nichts beendet. Sie können jederzeit Auto-Korrektur starten.']);
          return;
        }
        runAutoFixLoop();
      });

      retryBtn.addEventListener('click', () => {
        autoFixMode = false;
        runChecks(false);
      });

      runChecks(false);
    </script>
  </body>
</html>
