<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>ProvoWare HTML Tool</title>
    <link rel="stylesheet" href="assets/css/base.css" />
  </head>
  <body>
    <main id="app" class="app">
      <h1>ProvoWare HTML Tool</h1>
      <p id="status-text">Start bereit.</p>
      <section class="dashboard" aria-label="Dashboard-Skelett">
        <article class="card">
          <h2>Modulübersicht</h2>
          <p id="module-summary">Noch keine Module geladen.</p>
        </article>
        <article class="card" aria-label="Todo-Liste mit Kalender und Erinnerung">
          <h2>Todo-Liste mit Kalenderfunktion</h2>
          <p id="todo-info">Noch keine Aufgaben vorhanden.</p>
          <form id="todo-form" class="todo-form">
            <label>
              Aufgabe
              <input id="todo-title" type="text" maxlength="120" required />
            </label>
            <label>
              Fällig am
              <input id="todo-due-date" type="date" required />
            </label>
            <label>
              Erinnerung
              <input id="todo-reminder" type="datetime-local" required />
            </label>
            <button type="submit">Aufgabe hinzufügen</button>
          </form>
          <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
        </article>
      </section>
    </main>
    <script src="assets/js/core.js"></script>
  </body>
</html>
