<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desktop Dashboard Layout</title>
  <style>
    :root {
      --bg-0: #0b0f12;
      --bg-1: #11181d;
      --surface-1: rgba(255,255,255,0.03);
      --surface-2: rgba(255,255,255,0.015);
      --surface-3: rgba(255,255,255,0.035);
      --surface-4: rgba(255,255,255,0.012);
      --surface-5: rgba(255,255,255,0.025);
      --surface-6: rgba(255,255,255,0.01);
      --text-soft: #b8c7d1;
      --glow: #7fd0ff;
      --glow-2: #ffd86b;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.38);
      --shadow-hover: 0 14px 34px rgba(0, 0, 0, 0.42);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --header-h: 60px;
      --nav-w: 88px;
      --action-w: 260px;
      --footer-h: 146px;
      --gap: 14px;
      --tile-min-h: 140px;
      --panel-border: 1px solid rgba(255, 255, 255, 0.05);
      --panel-inset: inset 0 1px 0 rgba(255,255,255,0.05);
      --theme-border: rgba(255, 255, 255, 0.12);
      --theme-outline: rgba(127, 208, 255, 0.12);
      --theme-hover-border: rgba(127, 208, 255, 0.35);
      --overlay-1: rgba(127, 208, 255, 0.06);
      --overlay-2: rgba(255, 216, 107, 0.04);
      --overlay-3: rgba(255,255,255,0.02);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
    }

    body {
      padding: 14px;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, color-mix(in srgb, var(--glow) 18%, transparent), transparent 26%),
        radial-gradient(circle at top right, color-mix(in srgb, var(--glow-2) 15%, transparent), transparent 22%),
        linear-gradient(180deg, var(--bg-1), var(--bg-0));
    }

    .app-shell {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: var(--header-h) minmax(0, 1fr) auto;
      gap: var(--gap);
    }

    .panel-surface {
      background: linear-gradient(180deg, var(--surface-1), var(--surface-2));
      border: var(--panel-border);
      box-shadow: var(--panel-inset), var(--shadow);
    }

    .theme-surface {
      border-color: color-mix(in srgb, var(--glow) 25%, rgba(255,255,255,0.05));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        0 0 0 1px color-mix(in srgb, var(--glow) 10%, transparent),
        0 10px 30px rgba(0,0,0,0.35);
    }

    .theme-overlay::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--glow) 16%, transparent), transparent 40%, color-mix(in srgb, var(--glow-2) 10%, transparent)),
        linear-gradient(180deg, var(--overlay-3), rgba(255,255,255,0));
      pointer-events: none;
    }

    .interactive {
      transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .interactive:hover {
      transform: translateY(-1px);
      border-color: var(--theme-hover-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 0 0 1px var(--theme-outline), var(--shadow-hover);
    }

    .header {
      width: 100%;
      min-height: 0;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
    }

    .header-group,
    .header-actions,
    .theme-switcher {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stage {
      min-height: 0;
      display: grid;
      grid-template-columns: var(--nav-w) minmax(0, 1fr) var(--action-w);
      gap: var(--gap);
    }

    .nav,
    .actions,
    .tile,
    .footer-panel {
      min-height: 0;
    }

    .nav {
      border-radius: var(--radius-lg);
      padding: 12px 10px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
    }

    .nav-stack,
    .nav-bottom,
    .action-stack,
    .action-stack-secondary {
      display: grid;
      gap: 10px;
    }

    .nav-stack {
      align-content: start;
    }

    .nav-bottom {
      align-content: end;
    }

    .main-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(var(--tile-min-h), 1fr));
      gap: var(--gap);
    }

    .tile,
    .footer-panel,
    .icon-btn,
    .action-btn,
    .brand-chip,
    .footer-toggle {
      position: relative;
      overflow: hidden;
    }

    .tile {
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .actions {
      border-radius: var(--radius-lg);
      padding: 12px;
      display: grid;
      grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }

    .action-section {
      min-height: 0;
      border-radius: calc(var(--radius-lg) - 4px);
      border: 1px solid rgba(255,255,255,0.04);
      background: linear-gradient(180deg, var(--surface-5), var(--surface-6));
      padding: 10px;
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .action-stack,
    .action-stack-secondary {
      grid-auto-rows: minmax(52px, auto);
    }

    .footer-wrap {
      min-height: 0;
      display: grid;
      gap: 10px;
    }

    .footer-toggle-row {
      display: flex;
      justify-content: center;
    }

    .footer-toggle {
      width: 84px;
      height: 26px;
      border-radius: 999px;
      border: var(--panel-border);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--panel-inset), var(--shadow);
    }

    .footer {
      overflow: hidden;
      max-height: var(--footer-h);
      opacity: 1;
      transition: max-height 220ms ease, opacity 220ms ease;
    }

    .footer.collapsed {
      max-height: 0;
      opacity: 0;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--gap);
      min-height: var(--footer-h);
    }

    .footer-panel {
      min-height: var(--footer-h);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    button {
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 0;
    }

    .icon-btn,
    .action-btn,
    .brand-chip {
      border: var(--panel-border);
      background: linear-gradient(180deg, var(--surface-3), var(--surface-4));
      box-shadow: var(--panel-inset);
    }

    .brand-chip {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .icon-btn {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .action-btn {
      width: 100%;
      min-height: 56px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .symbol {
      position: relative;
      z-index: 1;
      color: var(--text-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(28px, 20%, 48px);
      height: clamp(28px, 20%, 48px);
      filter: drop-shadow(0 0 16px color-mix(in srgb, var(--glow) 10%, transparent));
    }

    .tile .symbol {
      width: clamp(42px, 24%, 66px);
      height: clamp(42px, 24%, 66px);
    }

    .footer-panel .symbol {
      width: 34px;
      height: 34px;
    }

    .footer-toggle .symbol {
      transition: transform 220ms ease;
    }

    .footer-toggle[aria-expanded="false"] .symbol {
      transform: rotate(180deg);
    }

    .swatch {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .swatch[data-theme="theme-camo"] {
      background: linear-gradient(135deg, #334127, #a89a58);
    }

    .swatch[data-theme="theme-red"] {
      background: linear-gradient(135deg, #6d151e, #ff6c47);
    }

    .swatch[data-theme="theme-neon"] {
      background: linear-gradient(135deg, #74fff3, #ffe460);
    }

    .swatch[data-theme="theme-ragga"] {
      background: linear-gradient(135deg, #4fe92a, #ff5a22);
    }

    .theme-camo {
      --bg-0: #090b08;
      --bg-1: #11150f;
      --text-soft: #d6c783;
      --glow: #bac16f;
      --glow-2: #d8b65f;
      --theme-hover-border: rgba(186, 193, 111, 0.38);
      --theme-outline: rgba(186, 193, 111, 0.12);
    }

    .theme-neon {
      --bg-0: #07090c;
      --bg-1: #0d1218;
      --text-soft: #f1f5ba;
      --glow: #89fff2;
      --glow-2: #ffd84c;
      --theme-hover-border: rgba(137, 255, 242, 0.38);
      --theme-outline: rgba(137, 255, 242, 0.12);
    }

    .theme-ragga {
      --bg-0: #120804;
      --bg-1: #1d120a;
      --text-soft: #ffe05f;
      --glow: #7dff33;
      --glow-2: #ff7a33;
      --theme-hover-border: rgba(125, 255, 51, 0.38);
      --theme-outline: rgba(125, 255, 51, 0.12);
    }

    .theme-red {
      --bg-0: #0b0608;
      --bg-1: #13090c;
      --text-soft: #ff9f7d;
      --glow: #ff563f;
      --glow-2: #ff8f6b;
      --theme-hover-border: rgba(255, 86, 63, 0.38);
      --theme-outline: rgba(255, 86, 63, 0.12);
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .stroke {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fill {
      fill: currentColor;
    }

    @media (max-width: 1180px) {
      body {
        overflow: auto;
      }

      .app-shell {
        min-height: calc(100vh - 28px);
        height: auto;
      }

      .stage {
        grid-template-columns: var(--nav-w) minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) auto;
      }

      .actions {
        grid-column: 1 / -1;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: none;
      }
    }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: none;
        grid-auto-rows: minmax(120px, auto);
      }

      .footer-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .stage {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }

      .nav {
        grid-template-rows: auto;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        align-items: stretch;
      }

      .nav-stack,
      .nav-bottom {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      .nav > div:empty {
        display: none;
      }

      .actions {
        grid-column: auto;
        grid-template-columns: 1fr;
      }

      .main-grid,
      .footer-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    <div class="footer-wrap">
      <div class="footer-toggle-row">
        <button class="footer-toggle interactive theme-surface" id="footerToggle" type="button" aria-expanded="true" aria-controls="footerPanels">
          <span class="symbol"><svg viewBox="0 0 24 24"><use href="#i-chevron"></use></svg></span>
        </button>
      </div>

      <footer class="footer" id="footerPanels" aria-label="Footer Panels">
        <div class="footer-grid">
          <button class="footer-panel panel-surface theme-surface theme-overlay interactive" type="button" aria-label="Footer Panel"><span class="symbol"><svg viewBox="0 0 24 24"><use href="#i-grid"></use></svg></span></button>
          <button class="footer-panel panel-surface theme-surface theme-overlay interactive" type="button" aria-label="Footer Panel"><span class="symbol"><svg viewBox="0 0 24 24"><use href="#i-chat"></use></svg></span></button>
          <button class="footer-panel panel-surface theme-surface theme-overlay interactive" type="button" aria-label="Footer Panel"><span class="symbol"><svg viewBox="0 0 24 24"><use href="#i-folder"></use></svg></span></button>
          <button class="footer-panel panel-surface theme-surface theme-overlay interactive" type="button" aria-label="Footer Panel"><span class="symbol"><svg viewBox="0 0 24 24"><use href="#i-pie"></use></svg></span></button>
        </div>
      </footer>
    </div>
  </div>

  <script>
    const body = document.body;
    const footer = document.getElementById("footerPanels");
    const footerToggle = document.getElementById("footerToggle");
    const themeButtons = document.querySelectorAll(".swatch");
    const themeClasses = ["theme-camo", "theme-red", "theme-neon", "theme-ragga"];

    footerToggle.addEventListener("click", () => {
      const collapsed = footer.classList.toggle("collapsed");
      footerToggle.setAttribute("aria-expanded", String(!collapsed));
    });

    themeButtons.forEach((swatch) => {
      swatch.addEventListener("click", () => {
        const nextTheme = swatch.dataset.theme;
        if (!themeClasses.includes(nextTheme)) {
          return;
        }
        body.classList.remove(...themeClasses);
        body.classList.add(nextTheme);
      });
    });
  </script>
</body>
</html>
