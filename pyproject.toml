[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provoware-html-tool"
version = "0.1.0"
description = "Linux desktop skeleton for the rebuilt Provoware HTML Tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
